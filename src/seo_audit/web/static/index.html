<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SEO Audit</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/report.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <h1>SEO Audit</h1>
      <p>Audit a page or a whole site and get verified, evidence-backed findings.</p>
    </header>

    <section class="card" id="form-card" aria-label="Audit form">
      <form id="audit-form" novalidate>
        <div class="field">
          <label for="url">URL</label>
          <input type="text" id="url" name="url" placeholder="https://example.com" autocomplete="off"
                 autofocus spellcheck="false" inputmode="url" aria-describedby="url-error">
          <p class="error-text" id="url-error" hidden></p>
        </div>

        <fieldset class="field">
          <legend class="label">Mode</legend>
          <div class="segmented" id="mode-control">
            <input type="radio" id="mode-page" name="mode" value="page" checked>
            <label for="mode-page">Page</label>
            <input type="radio" id="mode-site" name="mode" value="site">
            <label for="mode-site">Site</label>
          </div>
        </fieldset>

        <div class="field" id="max-pages-field" hidden>
          <label for="max-pages">Max pages</label>
          <input type="number" id="max-pages" name="max_pages" min="1" step="1" inputmode="numeric"
                 aria-describedby="max-pages-hint max-pages-error">
          <p class="hint" id="max-pages-hint">How many pages to crawl.</p>
          <p class="error-text" id="max-pages-error" hidden></p>
        </div>

        <div class="field">
          <label for="model">Model</label>
          <input type="text" id="model" name="model" autocomplete="off" spellcheck="false"
                 aria-describedby="model-hint">
          <p class="hint" id="model-hint">Any LiteLLM model, e.g. openai/gpt-4o</p>
        </div>

        <p class="error-text form-error" id="form-error" role="alert" hidden></p>
        <button type="submit" class="btn" id="run-button">Run audit</button>
      </form>
    </section>

    <section id="results" aria-live="polite"></section>
  </main>
</body>
</html>
